# Display server: static page + same-origin proxies to FreeFlight and adsbdb.
# Mounted as /etc/nginx/conf.d/default.conf in the nginx container.

proxy_cache_path /var/cache/nginx/overhead levels=1:2 keys_zone=overhead:1m max_size=50m inactive=1d use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Names are resolved per request (via variables below), so nginx
    # starts even when FreeFlight is down and follows it if its container IP changes.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # nginx speaks HTTP/1.0 to upstreams by default; adsb.lol answers that with
    # "426 Upgrade Required". Applies to every proxy below.
    proxy_http_version 1.1;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /config.json {
        alias /etc/overhead/config.json;
        add_header Cache-Control "no-store";
    }

    # /api/aircraft/<lat>/<lon>/<radius_nm>  ->  FreeFlight /v2/point/<lat>/<lon>/<radius_nm>
    location /api/aircraft/ {
        set $freeflight freeflight:8000;
        rewrite ^/api/aircraft/(.*)$ /v2/point/$1 break;
        proxy_pass http://$freeflight;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_cache overhead;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        # No stale fallback here: when FreeFlight is down the page should know and show its stale marker.
        add_header X-Cache $upstream_cache_status;
    }

    # /api/route/<callsign>  ->  https://api.adsbdb.com/v0/callsign/<callsign>
    location /api/route/ {
        set $adsbdb api.adsbdb.com;
        rewrite ^/api/route/(.*)$ /v0/callsign/$1 break;
        proxy_pass https://$adsbdb;
        proxy_ssl_server_name on;
        proxy_set_header Host api.adsbdb.com;
        proxy_set_header User-Agent "overhead-display (home use)";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache overhead;
        proxy_cache_valid 200 404 24h;   # unknown callsigns come back as 404; cache those too
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    # /api/sd/<routes|airports>/schema-01/<X>/<file>.csv  ->  the community route data on GitHub
    # (github.com/vradarserver/standing-data, updated daily). Only those CSV paths are allowed.
    # Each file is cached for a day, 404s too (most airlines have no split route files).
    location ~ "^/api/sd/(?<sdpath>(routes|airports)/schema-01/[A-Z0-9]/[A-Z0-9]{1,4}(-all|-[0-9])?\.csv)$" {
        set $github raw.githubusercontent.com;
        rewrite ^ /vradarserver/standing-data/main/$sdpath break;
        proxy_pass https://$github;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header User-Agent "overhead-display (home use)";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        proxy_cache overhead;
        proxy_cache_valid 200 404 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Content-Security-Policy; # GitHub's; not meant for this page
        add_header X-Cache $upstream_cache_status;
    }

    # /api/hexdb/route/<callsign>  ->  https://hexdb.io/api/v1/route/icao/<callsign>: a third
    # community route database. Cached a day, 404s too; hexdb asks for at most 1000 requests per
    # 5 minutes, and this makes a few per new flight.
    location /api/hexdb/route/ {
        set $hexdb hexdb.io;
        rewrite ^/api/hexdb/route/(.*)$ /api/v1/route/icao/$1 break;
        proxy_pass https://$hexdb;
        proxy_ssl_server_name on;
        proxy_set_header Host hexdb.io;
        proxy_set_header User-Agent "overhead-display (home use)";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache overhead;
        proxy_cache_valid 200 404 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    # /api/airline/<icao>  ->  https://api.adsbdb.com/v0/airline/<icao> (airline name from a callsign prefix)
    location /api/airline/ {
        set $adsbdb api.adsbdb.com;
        rewrite ^/api/airline/(.*)$ /v0/airline/$1 break;
        proxy_pass https://$adsbdb;
        proxy_ssl_server_name on;
        proxy_set_header Host api.adsbdb.com;
        proxy_set_header User-Agent "overhead-display (home use)";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache overhead;
        proxy_cache_valid 200 404 7d;    # airline names hardly change
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    # Phase 4: your own receiver. Uncomment, then add "/api/receiver/aircraft.json" as the
    # first entry of "sources" in config.json.
    # location = /api/receiver/aircraft.json {
    #     set $receiver ultrafeeder:80;
    #     rewrite ^ /data/aircraft.json break;
    #     proxy_pass http://$receiver;
    #     proxy_connect_timeout 2s;
    #     proxy_read_timeout 5s;
    # }
}
