# Builds the Android TV app (android/) into an installable APK on every change to it. Builds of
# main are also published as a GitHub release, so the newest APK is always at
# https://github.com/troylairson/air/releases/latest/download/overhead-tv.apk
# (the box redirects http://<box>:8090/tv.apk there, for the Downloader app on the TV).
# PR builds are only attached to their run, as the overhead-tv-apk artifact.
name: Android TV app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The runner image has the Android SDK; the build fetches any missing platform itself.
      - name: Build APK
        run: gradle --no-daemon -p android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: overhead-tv-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/overhead-tv-release.apk overhead-tv.apk
          gh release create "tv-v$VERSION" overhead-tv.apk \
            --target "$GITHUB_SHA" \
            --title "Overhead TV app $VERSION" \
            --notes "Android TV app build $VERSION. Install on the TV with the Downloader app: http://<box-ip>:8090/tv.apk (see README, \"Android TV app\")." \
            --latest
